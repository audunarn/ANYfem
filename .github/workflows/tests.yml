name: Application tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        default: full
        options: [full, quick, unit, integration, qualification]
      qualification_case:
        type: choice
        default: all
        options: [all, reported-spline-four-face]
      mesher_ref:
        type: string
        default: '946b9353924dbca6f326feb8cb0327bcae5c4ccc'
permissions:
  contents: read
jobs:
  quick:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    uses: ./.github/workflows/application-lane.yml
    with:
      profile: quick
  full:
    if: (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/application-lane.yml
    with:
      profile: full
  compatibility:
    if: (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    uses: ./.github/workflows/application-lane.yml
    with:
      profile: compatibility
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
  caller:
    if: (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/application-lane.yml
    with:
      profile: caller
      os: windows-latest
      python: '3.14.2'
  development:
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'full'
    uses: ./.github/workflows/application-lane.yml
    with:
      profile: ${{ inputs.scope }}
      qualification_case: ${{ inputs.qualification_case }}
      mesher_ref: ${{ inputs.mesher_ref }}
