name: tests

on:
  push:
    branches: [main, master]
    paths-ignore: ['docs/QT_CONVERSION.md', 'reports/**']
  pull_request:
    paths-ignore: ['docs/QT_CONVERSION.md', 'reports/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # These packages are intentionally consumed through their public package
      # APIs, but are not on PyPI yet.  Test the ecosystem revisions together
      # until normal versioned installation can replace these checkouts.
      # ANYsolver carries qualification paths near the Windows MAX_PATH limit.
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYsolver
          # Updated owner laws: Q4 assumed-strain plasticity and S3 von Karman.
          ref: 38e9abc179b9babf02d395c2d4f3c64291ff56ed
          path: .ecosystem/ANYsolver
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYpost
          ref: 4bcb60f0476bd4278f683653c652a909678308df
          path: .ecosystem/ANYpost
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYhydro
          ref: a3be2f1eeb634f93e5e5a557c1f6bff89b25e714
          path: .ecosystem/ANYhydro
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYstability
          ref: eab0737d3a44bcc41faa353459c8791404f9fad2
          path: .ecosystem/ANYstability
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYloads
          ref: 445ccbe5ea18f42f4c60907672769ca3d5aee301
          path: .ecosystem/ANYloads
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: 9d2abf6ac7659350a043501b0630a3d4fd20ea18
          path: .ecosystem/ANYgeometry
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYmesh
          ref: b6f7cf466865b1c4c34b8e5511ace97d00290f6c
          path: .ecosystem/ANYmesh
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYfileIO
          ref: 32f3bb65e3843d6fd7af6c4fdf76ce472a7f6555
          path: .ecosystem/ANYfileIO
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANY3dView
          ref: 6fa628bc3a9e1c74548901678ff2ee8033e6c5dc
          path: .ecosystem/ANY3dView
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYtk3D
          ref: 2caa92325885938c594f27145ed16069d807e364
          path: .ecosystem/ANYtk3D

      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYsection
          ref: 940fe01ab15fb997e642aa7d6a3f0fa6e79f82eb
          path: .ecosystem/ANYsection
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip "xarray>=2023.1"
          python -m pip install --no-deps -e .ecosystem/ANYmaterial
          python -m pip install --no-deps -e .ecosystem/ANYhydro -e .ecosystem/ANYstability
          python -m pip install --no-deps -e .ecosystem/ANYloads
          python -m pip install --no-deps -e .ecosystem/ANYgeometry
          python -m pip install --no-deps -e .ecosystem/ANYmesh
          python -m pip install --no-deps -e .ecosystem/ANYfileIO
          python -m pip install --no-deps -e .ecosystem/ANYsolver -e .ecosystem/ANYsolver/packages/results -e .ecosystem/ANYpost
          python -m pip install --no-deps -e ".ecosystem/ANY3dView[gpu]"
          python -m pip install --no-deps -e .ecosystem/ANYtk3D
          python -m pip install --no-deps -e .ecosystem/ANYsection
          # The matrix exercises the supported Tk/headless UI path. ModernGL
          # backend build coverage belongs to ANY3dView and is not required
          # for ANYfem's platform-independent GUI contract.
          # The installed-license gate checks every declared GUI dependency,
          # including the optional Qt candidate, even in the Tk/headless matrix.
          python -m pip install -e ".[dev]" "Pillow>=10,<13" "PySide6>=6.10.1,<6.11"

      - name: Check source and installed dependency licensing
        run: python tools/check_licenses.py --check-installed

      - name: Run the test suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/test_anyfem.py --profile full --out reports/full-suite

      - name: Run the test suite (Windows)
        if: runner.os == 'Windows'
        run: python tools/test_anyfem.py --profile full --out reports/full-suite

      # The full pytest fixture writes the same complete scientific report.
      # The runner checks its case inventory and status; do not solve it twice.

      - name: Report ANYstructure parity
        run: python -m anyfem.parity --out reports/parity

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYsolver
          # Updated owner laws: Q4 assumed-strain plasticity and S3 von Karman.
          ref: 38e9abc179b9babf02d395c2d4f3c64291ff56ed
          path: .ecosystem/ANYsolver
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYpost
          ref: 4bcb60f0476bd4278f683653c652a909678308df
          path: .ecosystem/ANYpost
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYhydro
          ref: a3be2f1eeb634f93e5e5a557c1f6bff89b25e714
          path: .ecosystem/ANYhydro
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYstability
          ref: eab0737d3a44bcc41faa353459c8791404f9fad2
          path: .ecosystem/ANYstability
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYloads
          ref: 445ccbe5ea18f42f4c60907672769ca3d5aee301
          path: .ecosystem/ANYloads
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: 9d2abf6ac7659350a043501b0630a3d4fd20ea18
          path: .ecosystem/ANYgeometry
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYmesh
          ref: b6f7cf466865b1c4c34b8e5511ace97d00290f6c
          path: .ecosystem/ANYmesh
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYfileIO
          ref: 32f3bb65e3843d6fd7af6c4fdf76ce472a7f6555
          path: .ecosystem/ANYfileIO
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANY3dView
          ref: 6fa628bc3a9e1c74548901678ff2ee8033e6c5dc
          path: .ecosystem/ANY3dView
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYtk3D
          ref: 2caa92325885938c594f27145ed16069d807e364
          path: .ecosystem/ANYtk3D

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip "xarray>=2023.1" build
          python tools/check_licenses.py
          python -m build

      - name: Check the metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python tools/check_release_artifacts.py dist

      - name: Install and import the wheel in a clean environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip "xarray>=2023.1"
          .wheel-smoke/bin/python -m pip install --no-deps .ecosystem/ANYmaterial
          .wheel-smoke/bin/python -m pip install --no-deps .ecosystem/ANYhydro .ecosystem/ANYstability
          .wheel-smoke/bin/python -m pip install --no-deps .ecosystem/ANYloads
          .wheel-smoke/bin/python -m pip install --no-deps .ecosystem/ANYgeometry
          .wheel-smoke/bin/python -m pip install --no-deps .ecosystem/ANYmesh
          .wheel-smoke/bin/python -m pip install --no-deps .ecosystem/ANYfileIO
          .wheel-smoke/bin/python -m pip install --no-deps .ecosystem/ANYsolver .ecosystem/ANYsolver/packages/results .ecosystem/ANYpost
          .wheel-smoke/bin/python -m pip install --no-deps ".ecosystem/ANY3dView[gpu]"
          .wheel-smoke/bin/python -m pip install --no-deps .ecosystem/ANYtk3D
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -c "import anyfem; import anyfem.ui.app; from importlib.metadata import version; assert anyfem.__version__ == version('ANYfem'); print('wheel import OK', anyfem.__version__)"
