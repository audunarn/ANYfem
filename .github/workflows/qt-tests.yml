name: Qt candidate acceptance

on:
  pull_request:
    paths:
      - 'src/anyfem/**'
      - 'tests/**'
      - 'tools/test_anyfem.py'
      - 'pyproject.toml'
      - 'dependency-licenses.json'
      - '.github/workflows/qt-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/anyfem/**'
      - 'tests/**'
      - 'tools/test_anyfem.py'
      - 'pyproject.toml'
      - 'dependency-licenses.json'
      - '.github/workflows/qt-tests.yml'
  workflow_dispatch:
    inputs:
      viewer_ref:
        description: Exact ANY3dView candidate commit containing the Qt host
        required: true
        type: string
        default: 6fa628bc3a9e1c74548901678ff2ee8033e6c5dc
      geometry_ref:
        description: Exact ANYgeometry commit with component planning and binding contracts
        required: true
        type: string
        default: 9d3196936a9e1ad7f9f957e778c8fd314d53d048
      mesher_ref:
        description: Exact ANYmesh commit with opt-in component parallel meshing and pool lifecycle
        required: true
        type: string
        default: 946b9353924dbca6f326feb8cb0327bcae5c4ccc
      schema6_fixtures:
        description: Run owner-generated schema-6 consumer checks with the selected geometry/mesher candidates
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: qt-tests-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt:
    # The integrated submodel matrix adds up to ten minutes to the desktop checks.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANY3dView
          ref: ${{ inputs.viewer_ref || '6fa628bc3a9e1c74548901678ff2ee8033e6c5dc' }}
          path: .ecosystem/ANY3dView
      # ANYfeSolver carries qualification paths near the Windows MAX_PATH limit.
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYfeSolver
          # Updated Q4/S3 owner laws, same as the headless matrix.
          ref: f54e3cde5abf70cb8c989eb106119eedd3e33025
          path: .ecosystem/ANYfeSolver
      # Results-only API repair: preserve the physical solver revision above.
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYfeSolver
          ref: f54e3cde5abf70cb8c989eb106119eedd3e33025
          path: .ecosystem/ANYfeSolver-results
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYpost
          ref: 9eb9713b92c1b3a476301150b5e89e350d515844
          path: .ecosystem/ANYpost
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYhydro
          ref: 56b3d0f7f0167b50a1b4517007361c7876a3bd38
          path: .ecosystem/ANYhydro
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYstability
          ref: eab0737d3a44bcc41faa353459c8791404f9fad2
          path: .ecosystem/ANYstability
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYloads
          ref: 0a671a30bfd213c30df16bb7142cfe4fa8e1fece
          path: .ecosystem/ANYloads
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: ${{ inputs.geometry_ref || '9d3196936a9e1ad7f9f957e778c8fd314d53d048' }}
          path: .ecosystem/ANYgeometry
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYmesh
          ref: ${{ inputs.mesher_ref || '946b9353924dbca6f326feb8cb0327bcae5c4ccc' }}
          path: .ecosystem/ANYmesh
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYfileIO
          ref: e01bd7056e1832e7e9c6a1209aef8a9ad042c996
          path: .ecosystem/ANYfileIO
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYtk3D
          ref: 2caa92325885938c594f27145ed16069d807e364
          path: .ecosystem/ANYtk3D
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYsection
          ref: 940fe01ab15fb997e642aa7d6a3f0fa6e79f82eb
          path: .ecosystem/ANYsection
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYsolid
          ref: 06f3276d9207376316502aca651c3455db984104
          path: .ecosystem/ANYsolid
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux desktop and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1-mesa-dri libgl1-mesa-dev libx11-dev libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0
      - name: Install candidate GUI and public owners
        env:
          ANYMESHER_REQUIRE_NATIVE: '1'
          ANYMESHER_DISABLE_NATIVE: '0'
        run: |
          python -m pip install --no-deps .ecosystem/ANYfeSolver-results/packages/results
          python -m pip install -e .ecosystem/ANYmaterial -e .ecosystem/ANYhydro -e .ecosystem/ANYstability -e .ecosystem/ANYloads -e ".ecosystem/ANYgeometry[planar]" -e .ecosystem/ANYfileIO -e .ecosystem/ANYmesh -e .ecosystem/ANYfeSolver -e .ecosystem/ANYpost -e ".ecosystem/ANY3dView[gpu,qt]" -e .ecosystem/ANYtk3D -e .ecosystem/ANYsection
          python -c "import importlib.metadata,pathlib,json,anyfesolver_results; import anyfesolver_results.principals as principals; expected=pathlib.Path(importlib.metadata.distribution('anyfesolver-results').locate_file('anyfesolver_results/__init__.py')).resolve(); actual=pathlib.Path(anyfesolver_results.__file__).resolve(); assert actual==expected,(actual,expected); assert callable(principals.principal_axes); print(json.dumps(dict(results_origin=str(actual),principal_axes_origin=principals.__file__,results_version=importlib.metadata.version('anyfesolver-results'))))"
          python -m pip install -e ".[dev,qt,tk]"
      - name: Saved pressure preparation, assembly and Qt application
        if: runner.os == 'Windows' && matrix.python == '3.11'
        env:
          QT_QPA_PLATFORM: offscreen
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_orcawave_pressure.py tests/test_qt_orcawave_pressure.py
      - name: Shell and solid submodel jobs and Qt results
        timeout-minutes: 10
        env:
          ANYFEM_REQUIRE_SOLID_STACK: '1'
          ANYFEM_RUN_QT_TESTS: '1'
          QT_QPA_PLATFORM: offscreen
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install ".ecosystem/ANYsolid[skfem]"
          python -c "import anygeometry.shell_detail, anymesher.structured_box, anyfesolver.solid_submodel, anysolid.backend, skfem, PySide6"
          python -m pytest -q tests/test_shell_driven_solid_jobs.py tests/test_qt_submodel_task.py tests/test_submodel_regional_integration.py tests/test_submodel_a8_regional.py --junitxml=reports/submodel-integration.xml
      - name: Default and explicit frontend launcher contracts
        run: python -m pytest tests/test_gui_launcher.py tests/test_launcher_ecosystem_preflight.py tests/test_license_policy.py tests/test_verification.py::test_the_package_declares_its_entry_points tests/test_verification.py::test_the_viewport_is_an_optional_extra -q
      - name: Check source and installed dependency licensing
        run: python tools/check_licenses.py --check-installed
      - name: Parallel mesh caller and containment contracts
        env:
          ANYFEM_RUN_PARALLEL_MESH_TESTS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python tools/test_anyfem.py --profile focused --out reports/parallel-mesh
          tests/test_mesh_execution_policy.py
          tests/test_mesh_execution_submission.py
          tests/test_mesh_task_parallel_lifecycle.py
          tests/test_job_process_containment.py
          tests/test_worker_retirement_edges.py
          tests/test_mesh_parallel_integration.py
      - name: Qt contained parallel mesh completion and cancellation
        timeout-minutes: 5
        env:
          ANYFEM_RUN_QT_TESTS: '1'
          ANYFEM_RUN_PARALLEL_MESH_TESTS: '1'
          ANYFEM_QT_TEST_BACKEND: software
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: >-
          python -m pytest tests/test_qt_mesh_parallel_integration.py -q
          -o faulthandler_timeout=30
          --junitxml=reports/qt-parallel-mesh.xml
      - name: Linux Qt platform startup
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt platform:', app.platformName())"
      - name: Feature attachment and persistence contracts
        run: >-
          python tools/test_anyfem.py --profile focused --out reports/feature-contracts
          tests/test_feature_attachments.py
          tests/test_document_geometry_snapshot.py
          tests/test_commercial_workflow_acceptance.py::test_feature_edit_suppress_undo_redo_preserves_scope_identity
          tests/test_intersection_meshing.py::test_changed_cylinder_feature_retains_project_references_and_undo
      - name: Qt workflows (Windows)
        if: runner.os == 'Windows'
        env:
          ANYFEM_RUN_QT_TESTS: '1'
          ANY3DVIEW_DISABLE_GPU: '1'
        run: python tools/test_anyfem.py --profile qt --backend software --out reports/qt-software
      - name: Qt workflows (Linux desktop)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          ANYFEM_RUN_QT_TESTS: '1'
          ANY3DVIEW_DISABLE_GPU: '1'
        run: xvfb-run -a python tools/test_anyfem.py --profile qt --backend software --out reports/qt-software
      - name: Qt engineering workflow (Linux OpenGL)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          ANYFEM_RUN_QT_TESTS: '1'
          ANYFEM_QT_TEST_BACKEND: 'gpu'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python tools/test_anyfem.py --profile qt --backend gpu --out reports/qt-gpu
      - name: Shared Qt GPU host (Linux Mesa)
        if: runner.os == 'Linux'
        working-directory: .ecosystem/ANY3dView
        env:
          QT_QPA_PLATFORM: xcb
          ANY3DVIEW_RUN_QT_TESTS: '1'
          ANY3DVIEW_RUN_QT_GPU_TESTS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -m pytest tests/test_qt_host.py -q --junitxml=../../reports/qt-viewer.xml
      - name: Generate schema-6 owner documents
        if: inputs.schema6_fixtures
        run: |
          python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
          python .ecosystem/ANYgeometry/tools/general_intersections/consumer_contract_fixtures.py reports/schema6-fixtures > reports/schema6-fixtures-build.log
      - name: Schema-6 persistence, references and detached preparation
        if: inputs.schema6_fixtures
        env:
          ANYFEM_SCHEMA6_FIXTURES: reports/schema6-fixtures
        run: python -m pytest tests/test_geometry_schema6_consumer.py -q --junitxml=reports/schema6-headless.xml
      - name: Schema-6 visible Qt (Windows software)
        if: inputs.schema6_fixtures && runner.os == 'Windows'
        env:
          ANYFEM_SCHEMA6_FIXTURES: reports/schema6-fixtures
          ANYFEM_RUN_QT_TESTS: '1'
          ANYFEM_QT_TEST_BACKEND: software
          ANY3DVIEW_DISABLE_GPU: '1'
        run: python -m pytest tests/test_qt_geometry_schema6_consumer.py -q --basetemp=reports/schema6-qt-output --junitxml=reports/schema6-qt.xml
      - name: Schema-6 visible Qt (Linux Mesa)
        if: inputs.schema6_fixtures && runner.os == 'Linux'
        env:
          ANYFEM_SCHEMA6_FIXTURES: reports/schema6-fixtures
          ANYFEM_RUN_QT_TESTS: '1'
          ANYFEM_QT_TEST_BACKEND: gpu
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -m pytest tests/test_qt_geometry_schema6_consumer.py -q --basetemp=reports/schema6-qt-output --junitxml=reports/schema6-qt.xml
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
