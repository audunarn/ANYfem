name: Qt application release smoke
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    uses: ./.github/workflows/application-lane.yml
    with:
      profile: qt
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
  gpu:
    uses: ./.github/workflows/application-lane.yml
    with:
      profile: qt
      os: ubuntu-latest
      python: '3.13'
      backend: gpu
