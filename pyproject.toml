[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYfem"
version = "0.3.2"
description = "Shell and beam finite-element application with native hybrid meshing, solving and postprocessing"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "ANYsolver>=0.3",
  "ANYmaterial>=0.1",
  "ANYgeometry[planar]>=0.4,<0.5",
  "ANYmesher>=0.3.1",
  "ANYfileio[semantics]>=0.2",
  "h5py>=3.15,<4",
  "platformdirs>=4.5,<5",
]

[project.optional-dependencies]
# The 3D viewport is only needed by anyfem.ui; the modelling, meshing,
# solving and postprocessing layers stay importable without a display.
gui = [
  "ANY3dView[gpu]>=0.5",
  "ANYtk3D>=0.5",
  "Pillow>=10,<13",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]

# A GUI entry point so no console window opens alongside the application.
[project.gui-scripts]
anyfem = "anyfem.ui.app:main"

[project.scripts]
anyfem-verify = "anyfem.verification:main"
anyfem-parity = "anyfem.parity:main"
anyfem-gate = "anyfem.migration:main"

[project.urls]
Homepage = "https://github.com/audunarn/ANYfem"
Repository = "https://github.com/audunarn/ANYfem"
Issues = "https://github.com/audunarn/ANYfem/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anyfem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-ra", "-p", "no:cacheprovider"]
