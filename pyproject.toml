[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYfem"
version = "0.4.3"
description = "Shell and beam finite-element application with native hybrid meshing, solving and postprocessing"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "dependency-licenses.json",
  "docs/LICENSE.md",
]
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "ANYfeSolver>=0.5.0,<0.6",
    "ANYpost>=0.1.3,<0.2",
  "ANYfeSolver-results>=2.2.0,<3",
  "ANYmaterial>=0.2,<0.3",
  "ANYloads>=0.1,<0.2",
  "ANYgeometry[planar]>=0.4.3,<0.5",
  "ANYmesher>=0.5.1,<0.6",
  "ANYfileio>=0.3.2,<0.4",
  "h5py>=3.15,<4",
  "platformdirs>=4.5,<5",
]

[project.optional-dependencies]
orcawave = [
  "ANYmesher @ git+https://github.com/audunarn/ANYmesh.git@946b9353924dbca6f326feb8cb0327bcae5c4ccc",
  "ANYloads @ git+https://github.com/audunarn/ANYloads.git@0a671a30bfd213c30df16bb7142cfe4fa8e1fece",
  "ANYhydro[orcawave] @ git+https://github.com/audunarn/ANYhydro.git@dec262f6af912b1d5de5027f62a27e536f3ce93e",
]
fatigue = ["ANYfatigue>=0.1,<0.2"]
drawings = ["ezdxf>=1.4,<2", "shapely>=2,<3"]
solid = ["ANYsolid[skfem]>=0.1,<0.2"]
post = ["ANYpost[results]>=0.1.3,<0.2"]
# The 3D viewport is only needed by anyfem.ui; the modelling, meshing,
# solving and postprocessing layers stay importable without a display.
gui = [
  "ANYgeometry[planar] @ git+https://github.com/audunarn/ANYgeometry.git@5dc4b1fffc3525dc707f784d582e2b723d441be7",
  "ANY3dView[gpu,qt]>=0.5.6,<0.6",
  "ANYmesher @ git+https://github.com/audunarn/ANYmesh.git@946b9353924dbca6f326feb8cb0327bcae5c4ccc",
  "Pillow>=10,<13",
  "PySide6>=6.10.1,<6.11",
]
tk = ["ANY3dView[gpu]>=0.5.6,<0.6", "ANYtk3D>=0.5.5,<0.6", "Pillow>=10,<13"]
# Source development uses an editable sibling viewer instead of the release pin.
qt = ["ANY3dView[gpu,qt,webgpu]>=0.5.6,<0.6", "Pillow>=10,<13", "PySide6>=6.10.1,<6.11"]
webgpu = ["ANY3dView[webgpu]>=0.5.6,<0.6", "Pillow>=10,<13", "PySide6>=6.10.1,<6.11"]
# Excel (.xlsx) pressure tables; CSV/TSV/text need nothing extra.
excel = ["ANYloads[excel]>=0.1,<0.2"]
# Optional floating-body linear response (hydrodynamics + coupled equilibrium worker); fixed-body ANYfem runs without it.
# The equilibrium itself runs in a separate configured runtime that holds the pinned ANYgeometry owner artifact.
floating = ["ANYhydro", "ANYstability[floating]"]
# Optional standard beam-section library (ANYsection); ANYfem runs without it.
sections = ["ANYsection[gui]>=0.1,<0.2"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]

# A GUI entry point so no console window opens alongside the application.
[project.gui-scripts]
anyfem = "anyfem.ui.qt:main"
anyfem-qt = "anyfem.ui.qt:main"
anyfem-tk = "anyfem.ui.tk:main"

[project.scripts]
anyfem-plate-drawings = "anyfem.application.plate_drawings:main"
anyfem-archive = "anyfem.post.archive:main"
anyfem-verify = "anyfem.verification:main"
anyfem-parity = "anyfem.parity:main"
anyfem-gate = "anyfem.migration:main"

[project.urls]
Homepage = "https://github.com/audunarn/ANYfem"
Repository = "https://github.com/audunarn/ANYfem"
Issues = "https://github.com/audunarn/ANYfem/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
anyfem = ["example_data/*.anyfem", "example_data/*.zip"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["anyfem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-ra", "-p", "no:cacheprovider"]
